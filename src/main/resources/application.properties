# Team B Ranking Engine — Application Configuration
#
# All sensitive values are read from environment variables.
# Set PORT, TEAM_C_BASE_URL, and TEAM_B_RANKING_WRITE_ENABLED
# in your deployment environment (Render dashboard or .env file locally).

# ─── Server ─────────────────────────────────────────────────────────────────
# Render injects PORT automatically. Spring Boot reads it here.
server.port=${PORT:8080}

# ─── Team C Integration ──────────────────────────────────────────────────────
# The deployed Team C backend URL (no trailing slash).
teamc.base-url=${TEAM_C_BASE_URL:https://rit-placement-team-c-backend.onrender.com}

# HTTP connect/read timeouts in seconds
teamc.timeout-seconds=${TEAM_C_TIMEOUT_SECONDS:30}

# ─── Ranking Write-back ───────────────────────────────────────────────────────
# Set to true once Team C implements the POST /api/v1/drive-rankings endpoint.
ranking.writeback.enabled=${TEAM_B_RANKING_WRITE_ENABLED:false}
ranking.writeback.url=${TEAM_B_RANKING_WRITE_URL:https://rit-placement-team-c-backend.onrender.com/api/v1/drive-rankings}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.placement.teamb=INFO
